[package]
name = "simuinput-tauri"
version = "0.0.0"
description = "模拟输入 · Tauri 版"
edition = "2021"
rust-version = "1.77"

[lib]
name = "simuinput_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSPasteboard", "NSEvent", "NSAppleScriptExtensions", "NSApplication", "NSMenu", "NSView", "NSGraphics", "NSResponder"] }
objc2-carbon = "0.3"
libc = "0.2"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
