name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon + renderer + NSIS installer
        run: npm run dist:win

      - name: Zip the app directory
        shell: pwsh
        run: |
          Compress-Archive -Path release\win-unpacked\* -DestinationPath release\xyw-portable.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ZIP = Get-ChildItem -Path release -Filter *.zip | Select-Object -First 1
          if (-not $ZIP) { Write-Error "No zip found"; exit 1 }
          $TAG = "win-${{ github.run_id }}"
          $TITLE = "Windows build ${{ github.run_id }} (${{ github.ref_name }})"
          gh release create $TAG "$($ZIP.FullName)" --title $TITLE --notes "Portable build. Extract and run. Branch: ${{ github.ref_name }}  Commit: ${{ github.sha }}" --prerelease
