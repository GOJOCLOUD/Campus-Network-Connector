name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Upgrade node-gyp (for VS2026 support)
        run: npm install node-gyp@latest

      - name: Locate MSVC and setup environment
        shell: pwsh
        run: |
          $vsWhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          Write-Host "VS installation: $vsPath"
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          Write-Host "vcvars: $vcvars"
          if (Test-Path $vcvars) {
            cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
              if ($_ -match '^(VCINSTALLDIR|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|PATH|INCLUDE|LIB|LIBPATH)=') {
                $name, $value = $_ -split '=', 2
                Write-Host "  $name=$value"
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
            Write-Host "MSVC environment exported"
          } else {
            Write-Error "vcvars64.bat not found at $vcvars"
          }

      - name: Build native addon + renderer + NSIS installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Win
          path: release/**/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $EXE = Get-ChildItem -Path release -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $EXE) {
            Write-Error "No .exe found under release/"
            exit 1
          }
          $TAG = "win-${{ github.run_id }}"
          $TITLE = "Windows build ${{ github.run_id }} (${{ github.ref_name }})"
          $NOTES_FILE = [System.IO.Path]::GetTempFileName()
          Set-Content -Path $NOTES_FILE -Value "Auto-built Windows exe. Branch: ${{ github.ref_name }}  Commit: ${{ github.sha }}" -Encoding UTF8
          gh release create $TAG "$($EXE.FullName)" --title $TITLE --notes-file $NOTES_FILE --prerelease
