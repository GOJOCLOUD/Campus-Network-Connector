name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon + renderer + NSIS installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Win
          path: release/**/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $EXE = Get-ChildItem -Path release -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $EXE) {
            Write-Error "No .exe found under release/"
            exit 1
          }
          $TAG = "win-${{ github.run_id }}"
          $TITLE = "Windows build ${{ github.run_id }} (${{ github.ref_name }})"
          $NOTES = "自动构建产物（exe）。分支：`${{ github.ref_name }}`；提交：`${{ github.sha }}`。"
          gh release create $TAG "$($EXE.FullName)" --title $TITLE --notes $NOTES --prerelease
