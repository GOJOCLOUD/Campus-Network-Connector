# 云打包：推送/手动触发后在 GitHub Runner 上完成
# 1) 下载独立 Python（python-build-standalone）并 pip 安装 backend 依赖 → python-runtime/
# 2) Vite build + electron-builder --mac dir → 仅产出 .app
#
# 产物：Actions → 本次运行 → Artifacts → 下载 mac-app（内含 Campus Network Connector.app）
name: Build macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build .app（bundle Python + electron-builder）
        run: |
          chmod +x scripts/bundle-python-runtime.sh
          npm run dist:mac

      - name: Resolve .app path
        id: apppath
        run: |
          APP="$(find release -maxdepth 4 -name '*.app' -type d | head -1)"
          if [[ -z "$APP" ]]; then
            echo "No .app under release/"
            find release -type d -maxdepth 5 || true
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Built: $APP"

      - name: Upload mac app artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: ${{ steps.apppath.outputs.path }}
          if-no-files-found: error
          retention-days: 14
